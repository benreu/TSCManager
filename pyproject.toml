[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tscmanager"
version = "0.1.0"
description = "Store, list, delete and test-print fonts and images on TSC label printers (TSPL2)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "GPL-3.0-or-later"}
dependencies = [
    "Pillow>=9.0.0",
]

[project.optional-dependencies]
qt = ["PySide2>=5.15.0"]
gtk = ["PyGObject>=3.40.0"]

[tool.setuptools]
py-modules = ["tscmanager"]

[tool.setuptools.packages.find]
include = ["tsccore*", "gtkui*", "qtui*"]
